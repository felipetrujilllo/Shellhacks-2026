# DigitalOcean App Platform spec for GridWatch (#8). Version-controlled on purpose: the
# console is not the source of truth, this file is. README "Deploying to DigitalOcean" has
# the procedure; the DATABASE_URL secret is deliberately NOT in here.
#
#   doctl apps create --spec .do/app.yaml              # first time
#   After editing this file, apply it from the LIVE spec (README "Custom domain"): updating
#   straight from this file sends DATABASE_URL with no value and wipes the secret.
#
# One app, two components, ONE origin per hostname:
#   web (static site) -> /       the Vite build
#   api (FastAPI)     -> /api    uvicorn; the /api prefix is stripped before the app sees it
#
# Serving both from one app is what breaks the URL cycle (the backend needs the frontend's
# origin for CORS, the frontend needs the backend's URL at build time). The frontend calls
# the API at the relative path /api, so whichever hostname served the page (relaygrid.us,
# www.relaygrid.us or the default *.ondigitalocean.app host) also answers its API calls:
# every request is same-origin, CORS never runs, and no hostname is baked into the bundle.
# FRONTEND_ORIGIN is ${APP_URL} only because app/config.py requires it; nothing in the
# demo depends on it being right.
name: gridwatch
region: nyc

# Custom domains, added on top of the default gridwatch-b3trj.ondigitalocean.app host, which
# keeps working (the app name stays `gridwatch`; renaming it would break the deploy). The
# domain is registered at Porkbun with its nameservers pointed at ns1/ns2/ns3.digitalocean.com,
# so DigitalOcean manages the relaygrid.us zone: it creates the records for these hosts and
# issues their TLS certificates itself once DNS resolves. PRIMARY is what ${APP_URL} becomes.
domains:
  - domain: relaygrid.us
    type: PRIMARY
    zone: relaygrid.us
  - domain: www.relaygrid.us
    type: ALIAS
    zone: relaygrid.us

ingress:
  rules:
    # Order matters: first matching prefix wins, so /api must come before /.
    - match:
        path:
          prefix: /api
      component:
        name: api
        # false (the default) => the service receives /health, /projects, /overlaps, which
        # is what app/routes.py serves. Flip this to true and every route 404s.
        preserve_path_prefix: false
    - match:
        path:
          prefix: /
      component:
        name: web

services:
  - name: api
    # A public clone URL (`git:`), not the GitHub integration. That integration needs the
    # DigitalOcean account that owns the app to have GitHub linked AND DigitalOcean's
    # GitHub app installed on the repo's owner - and the repo belongs to a teammate's
    # personal account, which only that teammate can install apps on. The repo is public,
    # so App Platform clones it anonymously instead.
    # Cost: this source type can't redeploy on push by itself, so the `deploy` job in
    # .github/workflows/ci.yml runs `doctl apps create-deployment` after CI passes on main -
    # see README "Redeploying".
    git:
      repo_clone_url: https://github.com/felipetrujilllo/Shellhacks-2026.git
      # main is the stable, demo-safe branch (CLAUDE.md ## Branches).
      branch: main
    source_dir: backend
    environment_slug: python
    # No build_command: the Python buildpack runs `pip install -r requirements.txt`, and
    # backend/requirements.txt is the single line `.` — this project, from pyproject.toml.
    # Adding a build_command here would just install everything a second time.
    run_command: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    http_port: 8080 # App Platform sets $PORT to this
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    health_check:
      # The route app/routes.py serves; it answers without touching Postgres.
      http_path: /health
      initial_delay_seconds: 15
    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        type: SECRET
        # No value on purpose. The Tiger Data credential is set once in the DO console (or
        # with `doctl apps update --env`) and never committed. Until it is set,
        # load_settings() raises ConfigError, the service fails to boot and the deploy is
        # marked failed — loud, instead of a healthy-looking app with an empty API.
      - key: FRONTEND_ORIGIN
        scope: RUN_TIME
        # The frontend is the `web` component of this same app, served at /, so the app's
        # own URL *is* the frontend's origin. ${web.PUBLIC_URL} would be the same host with
        # a trailing path, which CORS compares literally and would reject. With a PRIMARY
        # domain, ${APP_URL} is https://relaygrid.us; the other hosts don't need CORS because
        # the frontend's API calls are same-origin (VITE_API_URL below).
        value: ${APP_URL}

static_sites:
  - name: web
    git:
      repo_clone_url: https://github.com/felipetrujilllo/Shellhacks-2026.git
      branch: main
    source_dir: frontend
    build_command: npm run build
    # frontend/vite.config.ts sets no build.outDir, so Vite writes its default: dist.
    output_dir: dist
    envs:
      - key: VITE_API_URL
        # BUILD_TIME, not RUN_TIME: Vite inlines import.meta.env.VITE_* into the JS bundle
        # when it builds. A runtime-only value would never reach the browser, and
        # frontend/src/api.ts throws when VITE_API_URL is empty.
        scope: BUILD_TIME
        # Relative on purpose: the api component's ingress path, with no scheme or host. It
        # used to be ${api.PUBLIC_URL}, but once a PRIMARY domain exists that resolves to
        # https://relaygrid.us/api, so the bundle served at www.relaygrid.us or the
        # *.ondigitalocean.app host would call relaygrid.us cross-origin and the backend's
        # CORS (one allowed origin: FRONTEND_ORIGIN) would reject it. /api makes the browser
        # call the host that served the page, on every hostname. Keep it equal to the /api
        # ingress prefix above (backend/tests/test_app_spec.py checks that).
        value: /api
