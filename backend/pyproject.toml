[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gridwatch-backend"
version = "0.1.0"
description = "GridWatch backend: ingestion pipeline, overlap detection, and REST API"
requires-python = ">=3.11"
# Direct dependencies are pinned exactly (==) to the versions the suite was last run against, so
# a DigitalOcean rebuild or CI run can't pull in a breaking release with no code change.
# Transitive deps (starlette, pydantic_core, ...) are left to the resolver. To upgrade: bump a
# pin here, `pip install -e ".[dev]"`, run the Checks. tests/test_dependencies_pinned.py
# enforces the pins and that the venv running the tests matches them.
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.13.5",
    "psycopg[binary]==3.3.6",
    "httpx==0.28.1",
    "pdfplumber==0.11.10",
    "python-dotenv==1.2.3",
    "requests==2.34.2",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.9",
]

[tool.setuptools]
packages = ["app", "pipeline"]

[tool.setuptools.package-data]
# The standing sample submissions (app/samples.py) ship with the app wherever it is installed.
app = ["sample_submissions.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".venv"]

[tool.ruff.lint]
# PLW1514: open()/read_text()/write_text() without encoding= uses the platform default
# (cp1252 on Windows) and silently mangles non-ASCII data. It is a preview rule, so preview is
# on but explicit-preview-rules keeps every other preview rule off unless it is named here.
preview = true
explicit-preview-rules = true
select = ["E", "F", "W", "I", "B", "UP", "PLW1514"]
