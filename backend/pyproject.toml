[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gridwatch-backend"
version = "0.1.0"
description = "GridWatch backend: ingestion pipeline, overlap detection, and REST API"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "psycopg[binary]",
    "httpx",
    "pdfplumber",
    "python-dotenv",
    "requests",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.setuptools]
packages = ["app", "pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".venv"]

[tool.ruff.lint]
# PLW1514: open()/read_text()/write_text() without encoding= uses the platform default
# (cp1252 on Windows) and silently mangles non-ASCII data. It is a preview rule, so preview is
# on but explicit-preview-rules keeps every other preview rule off unless it is named here.
preview = true
explicit-preview-rules = true
select = ["E", "F", "W", "I", "B", "UP", "PLW1514"]
